name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall api src scripts

      - name: Generate frozen synthetic dataset
        run: |
          PYTHONPATH=src python scripts/generate_data.py \
            --transactions 100000 \
            --seed 42 \
            --fraud-rate 0.01 \
            --output-dir data/raw/synthetic

      - name: Materialize graph
        run: |
          PYTHONPATH=src python scripts/materialize_graph.py

      - name: Build graph API index
        run: |
          PYTHONPATH=src python scripts/build_graph_api_index.py

      - name: Run Ruff
        run: |
          ruff check api src scripts --exit-zero

      - name: Run stable unit tests
        run: |
          pytest -q tests/unit \
            --ignore=tests/unit/test_graph_ml_graphsage.py \
            --ignore=tests/unit/test_graph_ml_evaluation.py \
            --ignore=tests/unit/test_graph_ml_features.py \
            --ignore=tests/unit/test_graph_ml_training.py

      - name: Run Graph ML tests
        run: |
          pytest -q tests/unit/test_graph_ml_*.py

      - name: Run API tests
        run: |
          pytest -q tests/api

      - name: Run integration tests
        run: |
          pytest -q tests/integration

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
